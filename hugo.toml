baseURL = "https://stay-leave.github.io/"
title = "小刘的博客站"
theme = "hugo-theme-reimu"

defaultContentLanguage = "zh-CN"
[languages]
[languages.zh-CN]
locale = "zh-CN"
label = "简体中文"
weight = 1
hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true
