baseURL = "https://stay-leave.github.io/"
title = "小刘的博客站"
theme = "hugo-theme-reimu"

defaultContentLanguage = "zh-CN"
hasCJKLanguage = true
enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true
summaryLength = 140

[pagination]
  pagerSize = 10

[languages]
  [languages.zh-CN]
    label = "简体中文"
    locale = "zh-CN"
    weight = 1
    hasCJKLanguage = true
    title = "小刘的博客站"

[permalinks]
  post = "/post/:filename/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    guessSyntax = false
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"
