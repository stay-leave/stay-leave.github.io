name: Build Hugo site

on:
  push:
    branches: [main]
    paths:
      - "hugo-src/**"
      - ".github/workflows/hugo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Build and sync to Pages root
        run: bash hugo-src/scripts/publish.sh

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No site changes"
          else
            git commit -m "chore: rebuild site from hugo-src [skip ci]"
            git push
          fi
